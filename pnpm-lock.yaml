lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      '@ai-agent-platform/ai':
        specifier: workspace:*
        version: link:packages/ai
      '@ai-agent-platform/core':
        specifier: workspace:*
        version: link:packages/core
      '@ai-agent-platform/fan-tracker':
        specifier: workspace:*
        version: link:packages/domains/fan-tracker
      '@ai-agent-platform/integrations':
        specifier: workspace:*
        version: link:packages/integrations
      '@ai-agent-platform/pr-monitor':
        specifier: workspace:*
        version: link:packages/domains/pr-monitor
      '@ai-agent-platform/shared':
        specifier: workspace:*
        version: link:packages/shared
      '@ai-agent-platform/tools':
        specifier: workspace:*
        version: link:packages/tools
      '@types/node':
        specifier: ^20.12.7
        version: 20.19.43
      rimraf:
        specifier: ^5.0.5
        version: 5.0.10
      tsx:
        specifier: ^4.7.2
        version: 4.23.12
      turbo:
        specifier: ^2.0.4
        version: 2.10.10
      typescript:
        specifier: ^5.4.5
        version: 5.9.3